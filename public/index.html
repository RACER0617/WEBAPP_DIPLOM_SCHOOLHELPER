<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>В помощь школьнику — Вход</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand"><div class="logo">Ш</div><div><div class="title">В помощь школьнику</div><div class="small">Учебные материалы вашей школы</div></div></div>
      <div class="userbox"><div class="small">Нет аккаунта? Обратитесь к администратору</div></div>
    </header>

    <main class="center" style="margin-top:50px">
      <div style="max-width:420px;width:100%">
        <div class="form">
          <h2>Вход в систему</h2>
          <form id="login-form">
            <div class="field"><input class="input" name="login" placeholder="Логин" required></div>
            <div class="field"><input type="password" class="input" name="password" placeholder="Пароль" required></div>
            <div class="field"><button class="btn" type="submit">Войти</button></div>
          </form>
        </div>

        <div style="margin-top:16px;text-align:center" class="small">
          Тестовые аккаунты: admin/admin, teacher1/teacher1, student1/student1
        </div>
      </div>
    </main>

    <footer class="footer">Разработано — дипломный проект</footer>
  </div>

  <script src="/script.js"></script>
</body>
</html>
